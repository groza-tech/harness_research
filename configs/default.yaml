# Конфиг основного прогона. Всё, что влияет на результат, живёт здесь и
# попадает в run_manifest.json целиком (пиннинг §7.2 дизайн-дока).

scenarios:
  # Диапазоны (v, c) перекрываются, но розыгрыши с v - c < min_surplus
  # отбрасываются: сессия без взаимовыгодной сделки не несёт информации
  # о распределении излишка, зато портит метрику доли сделок D.
  v_low: 1000000.0
  v_high: 1600000.0
  c_low: 700000.0
  c_high: 1300000.0
  min_surplus: 50000.0
  # Дисконт-фактор: издержки задержки. При δ=0.9 равновесие Рубинштейна
  # даёт первому ходящему 1/(1+δ) ≈ 52.6% излишка.
  discount: 0.9
  max_rounds: 10
  # Пул общих случайных чисел. n_scenarios ≥ repeats, иначе сценарии
  # начнут повторяться внутри ячейки.
  n_scenarios: 60
  seed: 20260812
  unit: "руб. за партию"
  good: "квартальная поставка компонентов"

harness:
  market_comparables: 5
  market_noise_frac: 0.06
  verifier_max_concession_frac: 0.35
  verifier_max_repairs: 2
  planner_horizon: 4
  compaction_tail_turns: 2
  memory_window: 6

runner:
  # n ≥ 40 на ячейку (§4.4). Кратность четырём обязательна: полный цикл
  # контрбалансировки ролей и очереди хода занимает четыре повтора.
  repeats: 40
  max_workers: 4
  counterbalance_roles: true
  # Предохранители сессии. Живут в коде харнесса, а не в промпте.
  max_turns_per_session: 24
  max_tokens_per_session: 120000
  max_wall_s_per_session: 900.0
  max_consecutive_failures: 12
  fail_fast: false

# Оба режима информации обязательны: эффект, выживающий в I0, невозможно
# объяснить переодетой информационной асимметрией (§8).
info_regimes: ["I0", "I1"]

# base | terse | formal — проверка чувствительности к формулировке (§6.4).
prompt_variant: base
