# Пилот §4.4: 30 сессий на двух крайних ячейках.
# Задача — оценить фактическую дисперсию φ^A и пересчитать требуемое n
# ДО основного прогона. Неделя 6 — точка невозврата: если дисперсия требует
# непосильного числа повторов, надо менять сеттинг (упрощать сценарии,
# снижать T), а не гнать основной эксперимент в надежде.

scenarios:
  v_low: 1000000.0
  v_high: 1600000.0
  c_low: 700000.0
  c_high: 1300000.0
  min_surplus: 50000.0
  discount: 0.9
  max_rounds: 8
  n_scenarios: 32
  seed: 20260812
  unit: "руб. за партию"
  good: "квартальная поставка компонентов"

harness:
  market_comparables: 5
  market_noise_frac: 0.06
  verifier_max_concession_frac: 0.35
  verifier_max_repairs: 2
  planner_horizon: 4
  compaction_tail_turns: 2
  memory_window: 6

runner:
  repeats: 32          # кратно четырём: полный цикл контрбалансировки
  max_workers: 2
  counterbalance_roles: true
  max_turns_per_session: 20
  max_tokens_per_session: 400000
  max_wall_s_per_session: 600.0
  max_consecutive_failures: 8
  fail_fast: false

# Пилот гоним в полной информации: там есть теоретический эталон, с которым
# сверяется корректность стенда (§7.3 п.4).
info_regimes: ["I0"]
prompt_variant: base
