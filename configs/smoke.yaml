# Смоук инфраструктуры: минимальный прогон на mock-провайдере.
# Проверяет, что протокол, гейты, чекпоинты, метрики и отчёты работают
# end-to-end, не тратя ни рубля на API. Научной ценности не имеет —
# отчёты по такому прогону помечаются баннером.

scenarios:
  v_low: 1000000.0
  v_high: 1600000.0
  c_low: 700000.0
  c_high: 1300000.0
  min_surplus: 50000.0
  discount: 0.9
  max_rounds: 6
  n_scenarios: 16
  seed: 20260812

harness:
  market_comparables: 4
  market_noise_frac: 0.06
  verifier_max_concession_frac: 0.35
  verifier_max_repairs: 1
  planner_horizon: 3
  compaction_tail_turns: 2
  memory_window: 4

runner:
  repeats: 8
  max_workers: 4
  max_turns_per_session: 16
  max_tokens_per_session: 60000
  max_wall_s_per_session: 120.0
  max_consecutive_failures: 8

info_regimes: ["I0", "I1"]
prompt_variant: base
